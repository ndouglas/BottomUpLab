[package]
name = "survey"
default-run = "survey"
version = "0.1.0"
edition = "2021"
publish = false

# Not a member of the repository's workspace.
[workspace]

[features]
default = []
war-benchmarks = ["sugarscape-core/war-benchmarks"]

[[bin]]
name = "war1"
path = "src/bin/war1.rs"
required-features = ["war-benchmarks"]

[dependencies]
# Native-only exact evidence binding; MIT OR Apache-2.0.
sha2 = { version = "=0.10.9", default-features = false }
sugarscape-core = { path = "../crates/sugarscape-core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
rand = { version = "0.8", default-features = false, features = ["alloc"] }
rand_pcg = "0.3"

# Reuse the locked runtime SHA-256 package for the F5 build stamp.
[build-dependencies]
sha2 = { version = "=0.10.9", default-features = false }

[profile.release]
opt-level = 3
