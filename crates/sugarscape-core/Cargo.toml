[package]
name = "sugarscape-core"
description = "Sugarscape (Epstein & Axtell, 1996) simulation core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
war-benchmarks = []

[dependencies]
# Exact common software transcendentals for GeoSim native/WASM reproducibility.
libm = { version = "=0.2.16", default-features = false, features = ["force-soft-floats"] }
rand.workspace = true
rand_pcg = { workspace = true, features = ["serde1"] }
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }

[dev-dependencies]
proptest.workspace = true
