name: Deploy to GitHub Pages

# Deploys only after CI passes on a push to main (or when run by hand).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit CI tested; empty (the default ref) for manual runs.
          ref: ${{ github.event.workflow_run.head_sha }}
      - run: xz -dk crates/sugarscape-core/src/persistent_notes/tests/fixtures/evaluation-reference.json.xz
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            crates/sugarscape-experiments-wasm -> target
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          # Pinned: "latest" silently falls back to v0.9.1 when the release lookup
          # fails, and v0.9.1 cannot read workspace-inherited Cargo.toml fields.
          version: v0.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
