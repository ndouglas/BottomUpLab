name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  # The Rust checks run as parallel jobs; the run takes as long as the slowest.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Optimized with checks on: see [profile.test] in Cargo.toml.
      - run: cargo test --workspace
  book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --release -p sugarscape-cli -- sweep --builtin fig-iv-10-11 --seeds 1 --ticks 100 --quiet > /dev/null
      - run: cargo test -p sugarscape-core --release --test book -- --ignored
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p sugarscape-core --target wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          # Pinned: "latest" silently falls back to v0.9.1 when the release lookup
          # fails, and v0.9.1 cannot read workspace-inherited Cargo.toml fields.
          version: v0.15.0
      - run: wasm-pack test --node crates/sugarscape-wasm
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          # Pinned: "latest" silently falls back to v0.9.1 when the release lookup
          # fails, and v0.9.1 cannot read workspace-inherited Cargo.toml fields.
          version: v0.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: cargo build --release -p sugarscape-cli
        working-directory: .
      - run: npm test
  # Tiny GeoSim/democratic-peace fixtures only; registered histories stay outside CI.
  geosim:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: survey -> target
      - uses: actions/setup-python@v7
        with:
          python-version: 3.13.5
          cache: pip
          cache-dependency-path: survey/geosim/requirements.txt
      - run: python -m pip install -r survey/geosim/requirements.txt
      - run: cargo test --manifest-path survey/Cargo.toml --bin geosim --test geosim_native
      - run: python -m unittest discover -s survey/geosim -p 'test_*.py'
      - run: cargo test --locked --manifest-path survey/Cargo.toml --bin democratic_peace --test democratic_peace_native
      - run: python -m unittest discover -s survey/democratic_peace -p 'test_*.py'
  democratic-peace-report:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.13.5
          cache: pip
          cache-dependency-path: survey/democratic_peace/report-requirements.txt
      - run: python -m venv survey/out/democratic-peace-report-env
      - run: survey/out/democratic-peace-report-env/bin/python -m pip install -r survey/democratic_peace/report-requirements.txt
      - run: survey/out/democratic-peace-report-env/bin/python -m unittest discover -s survey/democratic_peace/report_tests -p 'test_*.py'
  war:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: "cargo test -p sugarscape-core --locked --features war-benchmarks war::"
      - run: cargo test -p sugarscape-core --locked --features war-benchmarks --test golden
      - run: cargo test --manifest-path survey/Cargo.toml --locked --features war-benchmarks --bin war1 --test war1_cli
      - run: cargo clippy -p sugarscape-core --all-targets --features war-benchmarks -- -D warnings
      - run: cargo clippy --manifest-path survey/Cargo.toml --bin war1 --test war1_cli --features war-benchmarks -- -D warnings
