<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%235949b7'/></svg>" />
    <title>BottomUpLab</title>
  </head>
  <body>
    <div id="banner" class="banner" hidden></div>
    <div id="notice" class="notice" role="status" hidden></div>
    <header id="toolbar"></header>
    <main id="playground" class="layout">
      <section class="stage">
        <div id="display" class="display"></div>
        <div id="grids" class="grids">
          <figure class="world" id="world-a">
            <header class="world-header" hidden></header>
            <canvas id="ring" class="ring-view" aria-label="Ring World’s ring" hidden></canvas>
            <canvas id="grid" aria-label="World grid"></canvas>
          </figure>
        </div>
        <div id="tools"></div>
      </section>
      <aside class="panel">
        <nav id="tabs" class="tabs" role="tablist"></nav>
        <div id="panel-body" class="panel-body"></div>
      </aside>
    </main>
    <main id="experiments" class="experiments" hidden></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
